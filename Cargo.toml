[package]
name = "bth-rigging"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Round-sling tension calculator for pick planning (WSTDA-RS-1)"

[lib]
name = "bth_rigging"
path = "src/lib.rs"

[[bin]]
name = "bth-rigging"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
dioxus = { version = "=0.7.9", features = ["router"], optional = true }
infinite-db = "0.4"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.15", optional = true }
typst = "0.15"
typst-pdf = "0.15"
typst-as-lib = { version = "0.16", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }

[features]
default = ["desktop"]
desktop = ["dep:dioxus", "dioxus/desktop", "dep:rfd"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
